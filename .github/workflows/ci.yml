name: CI

# The fast gate, once per pull request update and on main. The slow tests (fixtures, hashes,
# vectors) run on main only; the fixture downloads are cached by the manifest's hash.
# A change to the files below alone cannot change a result, so it starts nothing.
on:
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - CLAUDE.md
      - NOTICE
      - docs/design.md
      - docs/adr/**
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - CLAUDE.md
      - NOTICE
      - docs/design.md
      - docs/adr/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run lint-imports
      - run: uv run pytest -m "not slow" -n auto
      # The lowest supported Python.
      - run: uv run --locked --isolated --python 3.12 pytest -q -m "not slow" -n auto

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # The browser tests of the built viewer save screenshots for people to review.
      - run: bunx playwright install --with-deps chromium
      - run: bun run --cwd viewer test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: viewer/screenshots/
          if-no-files-found: ignore

  slow:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: conformance/fixtures/downloads
          key: fixtures-${{ hashFiles('conformance/fixtures/manifest.json') }}
      - uses: actions/cache@v4
        with:
          path: .cache/model
          key: model-${{ hashFiles('scripts/fetch_model.py') }}
      # Vectors of texts already embedded (the builder's cache), refreshed by each run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mosaic
          key: vectors-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: vectors-${{ hashFiles('uv.lock') }}-
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The viewer's slow tests open pages in a real browser.
      - run: bunx playwright install --with-deps chromium
      - run: uv run python scripts/fetch_fixtures.py
      - run: uv run python scripts/fetch_model.py
      # Vectors can differ in a few bits between processors (ADR-005): say which one ran.
      - run: lscpu | grep 'Model name'; grep -o -m1 -wE 'avx512_vnni|avx_vnni|avx512f|avx2' /proc/cpuinfo | sort -u | xargs
      - run: uv run pytest -q -m slow
